# Manual unsigned validation only. No store publishing or signing credentials.
workflows:
  android-unsigned:
    name: GIZO GOLD Android unsigned AAB
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      node: 22.23.0
      java: 21
      xcode: '26.4'
      vars:
        BUN_VERSION: '1.4.4'
    scripts:
      - name: Install Bun and project dependencies
        script: |
          set -euo pipefail
          curl -fsSL https://bun.sh/install -o /tmp/install-bun.sh
          bash /tmp/install-bun.sh "bun-v$BUN_VERSION"
          export PATH="$HOME/.bun/bin:$PATH"
          bun install --frozen-lockfile
      - name: Test, build web assets and synchronize Capacitor
        script: |
          set -euo pipefail
          export PATH="$HOME/.bun/bin:$PATH"
          bun run test
          bun run build
          node scripts/check-native-assets.mjs
          npx --no-install cap sync
          node scripts/check-native-assets.mjs --synced
      - name: Install Android SDK and build unsigned release bundle
        script: |
          set -euo pipefail
          mkdir -p build
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > android/local.properties
          sdkmanager "platforms;android-36" "build-tools;35.0.0"
          chmod +x android/gradlew
          (cd android && ./gradlew --no-daemon bundleRelease --stacktrace) 2>&1 | tee build/android-build.log
          test -s android/app/build/outputs/bundle/release/app-release.aab
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
      - build/android-build.log

  ios-unsigned:
    name: GIZO GOLD iOS unsigned archive
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      node: 22.23.0
      java: 21
      xcode: '26.4'
      vars:
        BUN_VERSION: '1.4.4'
    scripts:
      - name: Install Bun and project dependencies
        script: |
          set -euo pipefail
          curl -fsSL https://bun.sh/install -o /tmp/install-bun.sh
          bash /tmp/install-bun.sh "bun-v$BUN_VERSION"
          export PATH="$HOME/.bun/bin:$PATH"
          bun install --frozen-lockfile
      - name: Test, build web assets and synchronize Capacitor
        script: |
          set -euo pipefail
          export PATH="$HOME/.bun/bin:$PATH"
          bun run test
          bun run build
          node scripts/check-native-assets.mjs
          npx --no-install cap sync
          node scripts/check-native-assets.mjs --synced
      - name: Resolve Swift packages and archive without signing
        script: |
          set -euo pipefail
          mkdir -p build
          xcodebuild -resolvePackageDependencies \
            -project ios/App/App.xcodeproj -scheme App \
            -clonedSourcePackagesDirPath "$CM_BUILD_DIR/build/SourcePackages" \
            2>&1 | tee build/ios-packages.log
          xcodebuild archive \
            -project ios/App/App.xcodeproj -scheme App \
            -configuration Release -destination 'generic/platform=iOS' \
            -clonedSourcePackagesDirPath "$CM_BUILD_DIR/build/SourcePackages" \
            -archivePath "$CM_BUILD_DIR/build/GizoGold.xcarchive" \
            -resultBundlePath "$CM_BUILD_DIR/build/GizoGold.xcresult" \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build/ios-build.log
          test -d build/GizoGold.xcarchive/Products/Applications/App.app
          ditto -c -k --sequesterRsrc --keepParent build/GizoGold.xcarchive build/GizoGold-unsigned.xcarchive.zip
          ditto -c -k --sequesterRsrc --keepParent build/GizoGold.xcresult build/GizoGold.xcresult.zip
    artifacts:
      - build/*.zip
      - build/ios-*.log
      - ios/App/App.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved